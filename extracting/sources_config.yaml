# --- GLOBAL SCRAPING SETTINGS ---
scraping_settings:
  # Mandatory: Set to false to allow scraping Google/Mainstream media
  robots_txt_obey: false 
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  download_delay: 2
  autothrottle_enabled: true
  concurrent_requests_per_domain: 1
  cookies_enabled: false

content_filters:
  required_keywords: ["sekta", "nové náboženské hnutí", "kult"]
  exclude_keywords: ["sport", "film", "počasí"]

# Centralized keywords configuration for all spiders, API scrapers and NLP modules
