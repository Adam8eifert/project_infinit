# 📁 extracting/sources_config.yaml
# Complete configuration for all scraping sources - Project Infinit
# Manages RSS feeds, Web scraping, and API integrations

sources:
  # --- RSS FEEDS (Specialized) ---
  religionistika_muni:
    name: "Religionistika MU (Novinky)"
    domain: "religionistika.phil.muni.cz"
    url: "https://religionistika.phil.muni.cz/rss"
    enabled: true
    type: "rss"
    output_csv: "export/csv/religionistika_muni_rss_raw.csv"
    delay: 2
  
  dingir_main:
    name: "Dingir.cz (Main RSS)"
    domain: "dingir.cz"
    url: "https://www.dingir.cz/"
    enabled: false # RSS feed not available (404)
    type: "rss"
    output_csv: "export/csv/dingir_main_rss_raw.csv"
    delay: 2
  
  apologet:
    name: "Apologet.cz (RSS Feed)"
    domain: "apologet.cz"
    url: "https://www.apologet.cz/?feed=rss2"
    enabled: true
    type: "rss"
    output_csv: "export/csv/apologet_rss_raw.csv"
    delay: 2

  sekty_tv:
    name: "Sekty.TV (RSS Feed)"
    description: "Specialist website about cults and religious movements in CZ"
    domain: "sekty.tv"
    url: "https://sekty.tv/feed/"
    enabled: true
    type: "rss"
    selectors:
      item: "item"
      title: "title::text"
      link: "link::text"
      content: "content:encoded::text"
      date: "pubDate::text"
      author: "dc:creator::text"
    output_csv: "export/csv/sekty_tv_rss_raw.csv"
    delay: 2

  sekty_tv_web:
    name: "Sekty.TV (Web Scraping)"
    description: "Web scraper for sekty.tv with full article extraction"
    domain: "sekty.tv"
    url: "https://sekty.tv/"
    enabled: true
    type: "web"
    selectors:
      article: "article.post, div.post.entry"
      title: "h3.feature-posts-title a::text, h2 a::text, h3 a::text"
      link: "h3.feature-posts-title a::attr(href), h2 a::attr(href)"
      excerpt: ".entry-excerpt::text, p::text"
      date: "time::attr(datetime)"
      author: ".author::text, .post-author::text"
      categories: "a[rel='category tag']::text"
    output_csv: "export/csv/sekty_tv_web_raw.csv"
    delay: 3
    max_pages: 5  # Limit pagination to prevent excessive scraping

  sekty_cz:
    name: "Sekty.cz"
    description: "Information portal on new religious movements"
    domain: "sekty.cz"
    url: "https://sekty.cz/novinky/feed/"
    enabled: false # Returns 403 Forbidden (bot/crawler detection via ATS)
    type: "rss"
    selectors:
      item: "item"
      title: "title::text"
      link: "link::text"
      content: "content:encoded::text"
      date: "pubDate::text"
    output_csv: "export/csv/sekty_cz_rss_raw.csv"
    delay: 2

  info_dingir:
    name: "Dingir.cz (RSS Feed)"
    description: "Expert website dedicated to new religious movements"
    domain: "info.dingir.cz"
    url: "https://info.dingir.cz/feed/"
    enabled: true
    type: "rss"
    selectors:
      item: "item"
      title: "title::text"
      link: "link::text"
      content: "content:encoded::text"
      date: "pubDate::text"
    output_csv: "export/csv/info_dingir_rss_raw.csv"
    delay: 2

  pastorace:
    name: "Pastorace.cz (RSS Feed)"
    description: "Pastoral care articles on cults"
    domain: "pastorace.cz"
    url: "https://www.pastorace.cz/rss/canal.xml"
    enabled: true
    type: "rss"
    selectors:
      item: "item"
      title: "title::text"
      link: "link::text"
      content: "description::text"
      date: "pubDate::text"
    output_csv: "export/csv/pastorace_rss_raw.csv"
    delay: 2

  vira_cz:
    name: "Vira.cz (RSS Feed)"
    description: "Religious portal providing general Christian perspectives and news"
    domain: "vira.cz"
    url: "https://www.vira.cz/rss/canal.xml"
