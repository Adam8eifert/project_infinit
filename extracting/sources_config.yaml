# Document validation settings for PDF/DOC imports
document_validation:
  # Uses unified keywords list from keywords.required (via YAML anchor)
  czech_religious_keywords: *religious_keywords
  
  # Minimum word count for documents
  min_word_count: 50
  
  # Minimum text length in characters
  min_text_length: 100
  exclude: [
    "film",
    "seriál",
    "videohra",
    "pc hra",
    "hudební skupina",
    "kapela",
    "album",
    "počítačová hra",
    "politika",
    "politiky",
    "politické",
    "volby"
  ]
  exclude_context_patterns: [
    'recenze\\s+filmu',
    'hra\\s+roku',
    'herní\\s+recenze',
    'soundtrack',
    'trailer'
  ]